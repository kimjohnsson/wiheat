name: Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.3)'
        required: true
        type: string
      dry_run:
        description: 'Test release without creating a tag or release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Version must use semantic versioning, for example 0.1.3"
            exit 1
          fi

      - name: Check manifest version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MANIFEST_VERSION=$(python -c "
          import json
          with open('custom_components/wiheat/manifest.json') as f:
              print(json.load(f)['version'])
          ")

          echo "Release version:  $VERSION"
          echo "Manifest version: $MANIFEST_VERSION"

          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: Release version does not match manifest.json"
            exit 1
          fi

      - name: Check tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "ERROR: Tag $VERSION already exists"
            exit 1
          fi

      - name: Check release does not already exist
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "ERROR: A release for $VERSION already exists"
            exit 1
          fi

      - name: Run tests
        run: python tests/test_payload_mode_fan.py

      - name: Validation successful
        run: |
          echo "All release checks passed."
          echo "Version: ${{ inputs.version }}"

  create-tag:
    name: Create release tag
    needs: validate
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION" origin/main
          git push origin "$VERSION"

  release:
    name: Create release draft
    needs: create-tag
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --draft \
            --generate-notes \
            --fail-on-no-commits \
            --verify-tag

  dry-run:
    name: Dry run complete
    needs: validate
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest

    steps:
      - name: Report dry run
        run: |
          echo "Dry run completed successfully."
          echo "No tag or release was created."
          echo "Version: ${{ inputs.version }}"
